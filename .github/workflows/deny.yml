# Dependency policy: RUSTSEC advisories, duplicate crates, license names —
# the rules live in deny.toml and run with `cargo deny check`.
#
# Safe for pull requests from forks: it runs on GitHub's machines with a
# read-only token and no secrets, and builds nothing (the check is on
# crates.io metadata), so no fork code executes.
name: Deny

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
