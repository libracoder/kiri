<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Kiri app icon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B232C"/>
      <stop offset="1" stop-color="#0F1419"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#E0B420" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E0B420" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDC23A"/>
      <stop offset="1" stop-color="#CC9A0C"/>
    </linearGradient>
  </defs>
  <!-- Windows: the tile fills the square, the mark drawn larger -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#glow)"/>
  <rect x="1" y="1" width="1022" height="1022" rx="229" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
  <!-- mark: 86% of the tile wide, centred -->
  <g transform="translate(56.8 34.4) scale(14.926)">
    <g transform="translate(6 0) skewX(-10)">
      <clipPath id="ic"><rect x="22" y="12" width="34" height="40" rx="10"/></clipPath>
      <g fill="url(#box)"><rect x="22" y="12" width="34" height="40" rx="10"/></g>
      <g clip-path="url(#ic)" fill="#F2CF5B"><rect x="10" y="0" width="60" height="21.5"/></g>
      <g fill="#0F1419"><ellipse cx="41.5" cy="29" rx="3.1" ry="3.6"/><ellipse cx="50.5" cy="29" rx="3.1" ry="3.6"/></g>
      <g fill="#FFFFFF" opacity="0.9"><circle cx="42.6" cy="27.6" r="0.9"/><circle cx="51.6" cy="27.6" r="0.9"/></g>
    </g>
    <g fill="#F6F2EA"><rect x="5" y="21.5" width="13" height="5" rx="2.5"/><rect x="1" y="32" width="15" height="5" rx="2.5"/><rect x="7" y="42.5" width="7" height="5" rx="2.5"/></g>
  </g>
</svg>
