# Kiri's container bridges (kiri0, kiri1, ...) and their veths (kv... for a
# container's first network, kx... for the others) are set up by Kiri itself.
# NetworkManager leaves them alone, so containers starting and stopping don't
# run its dispatcher scripts, which on Fedora trip SELinux denials for
# nm-dispatcher (sys_admin, sys_resource).
#
# A [device-*] section is additive; [keyfile] unmanaged-devices= here would
# overwrite Ubuntu/Debian's 10-globally-managed-devices.conf. interface-name:
# uses GLib simple globs (* and ? only, no [...] character classes), so veths
# are matched by their fixed id-prefix length (kv + 9 id + 4 hex; kx + 9 id +
# index), leaving short host names like kvm0 or kvlan0 alone.
[device-kiri]
match-device=interface-name:kiri*,interface-name:kv?????????????,interface-name:kx??????????*
managed=0
