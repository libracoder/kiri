# Kiri's container bridges (kiri0, kiri1, …) and their veths (kv… for a
# container's first network, kx… for the others) are set up by Kiri itself. NetworkManager leaves them alone, so containers starting and
# stopping don't run its dispatcher scripts, which on Fedora trip SELinux
# denials for nm-dispatcher (sys_admin, sys_resource).
[keyfile]
unmanaged-devices=interface-name:kiri*;interface-name:kv*;interface-name:kx*
