[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
# Not a release number: a release takes its version from its tag (v0.2.0),
# set by the release build. Builds from a checkout say 0.0.0.
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# Debug info goes, function names stay: crash reports' backtraces
# (`crate::diag`) then name the functions instead of bare addresses.
strip = "debuginfo"

[profile.dev]
panic = "abort"
