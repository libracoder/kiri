[package]
name = "kiri-vmm"
description = "Boots the Kiri guest VM with Apple's Virtualization.framework"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
libc = "0.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSFileHandle", "NSObject", "NSString", "NSURL"] }
objc2-virtualization = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "dispatch2",
    "VZBootLoader", "VZLinuxBootLoader", "VZPlatformConfiguration", "VZGenericPlatformConfiguration",
    "VZVirtualMachine", "VZVirtualMachineConfiguration", "VZVirtualMachineDelegate",
    "VZSerialPortConfiguration", "VZVirtioConsoleDeviceSerialPortConfiguration",
    "VZSerialPortAttachment", "VZFileHandleSerialPortAttachment",
    "VZSocketDevice", "VZSocketDeviceConfiguration", "VZVirtioSocketDevice", "VZVirtioSocketDeviceConfiguration",
    "VZVirtioSocketListener", "VZVirtioSocketConnection",
    "VZEntropyDeviceConfiguration", "VZVirtioEntropyDeviceConfiguration",
    "VZMemoryBalloonDeviceConfiguration", "VZVirtioTraditionalMemoryBalloonDeviceConfiguration",
    "VZMemoryBalloonDevice", "VZVirtioTraditionalMemoryBalloonDevice",
    "VZStorageDeviceConfiguration", "VZVirtioBlockDeviceConfiguration",
    "VZStorageDeviceAttachment", "VZDiskImageStorageDeviceAttachment",
    "VZNetworkDeviceConfiguration", "VZVirtioNetworkDeviceConfiguration",
    "VZNetworkDeviceAttachment", "VZNATNetworkDeviceAttachment", "VZMACAddress",
    "VZDirectorySharingDeviceConfiguration", "VZVirtioFileSystemDeviceConfiguration",
    "VZDirectoryShare", "VZSingleDirectoryShare", "VZSharedDirectory", "VZLinuxRosettaDirectoryShare",
] }

[lints]
workspace = true
