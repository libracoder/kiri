[package]
name = "kiri-image"
description = "OCI image references, registry pulls and the content-addressed blob store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The system's root certificates (macOS keychain, Windows store, /etc/ssl),
# merged with webpki-roots for registries, updates and Share (#303).
rustls-native-certs = "0.8"
webpki-roots = "1"

[dev-dependencies]
# Tests build a self-signed CA and a webpki trust-anchor certificate, and
# serve TLS on localhost to prove the store accepts it.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true
