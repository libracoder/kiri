[package]
name = "kiri-image"
description = "OCI image references, registry pulls and the content-addressed blob store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# flate2: plain-tar layers are gzipped on their way out (save, push), as
# BuildKit's are; already in the workspace for pulls and ADD.
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# ruzstd: compress::ZstdFrames reads a zstd layer whole (every frame), with
# the decoder the engine and the guest already unpack layers with.
ruzstd = "0.9"
# libc: whether the process that wrote a leftover file is still alive.
libc = "0.2"

[features]
# Named kill points on the commit path for the crash tests (src/fault.rs);
# never on in a release build.
fault-inject = []

[lints]
workspace = true
