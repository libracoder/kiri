[package]
name = "kiri-image"
description = "OCI image references, registry pulls and the content-addressed blob store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider"] }
# The rustls and ring crypto provider ureq is built without
# ("rustls-no-provider"): connect.rs's tls_config hands ring to every agent.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The system's root certificates (macOS keychain, Windows store, /etc/ssl),
# merged with the bundled Mozilla set for registries, updates and Share (#303).
# roots.rs is self-contained (rustls-pki-types, rustls-native-certs, the
# bundled set only): kiri-win compiles it by path, without kiri-image.
rustls-native-certs = "0.8"
rustls-pki-types = "1"
webpki-root-certs = "1"

# The roots an administrator distrusted (roots.rs): "Never Trust" in the
# macOS trust settings, the Windows Disallowed store. Both already come in
# with rustls-native-certs.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
schannel = "0.1"

[dev-dependencies]
# Tests serve TLS on localhost with a self-signed CA to prove both insecure
# registries and merged-root trust (#303).
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }

[lints]
workspace = true
